name: Release desktop packages

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the rebuilt macOS artifact as a Preview GitHub Release
        required: true
        default: false
        type: boolean
      release_tag:
        description: Existing vX.Y.Z tag to rebuild and publish (required when publishing)
        required: false
        type: string

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS arm64
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install macOS build helpers
        run: python3 -m pip install --disable-pip-version-check certifi==2025.8.3
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Check shared desktop code
        run: npm run desktop:check
      - name: Download and verify OpenDataLoader CLI
        shell: bash
        run: |
          jar_path="$(zsh apps/desktop/scripts/fetch-opendataloader.sh)"
          echo "MY_SCHOLAR_ODL_JAR=$jar_path" >> "$GITHUB_ENV"
          echo "MY_SCHOLAR_ODL_SHA256=104a5523c812ba3a43a3c7dd6156e33f23d0e32f03ef1ac629009ef96d7a79e1" >> "$GITHUB_ENV"
          echo "MY_SCHOLAR_BUILD_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          echo "MY_SCHOLAR_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Build internal macOS package
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release != true
        run: npm --prefix apps/desktop run dist:mac:internal

      - name: Build ad-hoc macOS Preview package
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        run: npm --prefix apps/desktop run dist:mac:internal
      - name: Verify packaged runtime boundary
        run: node apps/desktop/tests/mac_release_test.js "apps/desktop/dist/mac.noindex/mac-arm64/谷子学术.app"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: guzi-scholar-macos-arm64
          path: apps/desktop/dist/mac.noindex/*.dmg
          if-no-files-found: error

  publish:
    name: Manually publish one macOS Preview Release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate the explicit publish gate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Manual publishing requires an existing vX.Y.Z release_tag." >&2
            exit 1
          fi
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: guzi-scholar-macos-arm64
          path: release
      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - name: Write Preview release notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cat > release-notes.md <<EOF
          ## macOS Preview

          Guzi Scholar ${RELEASE_TAG} is an internal macOS Apple Silicon preview package.

          - This DMG uses ad-hoc signing and has not been signed with an Apple Developer ID or notarized by Apple.
          - On first launch, macOS may show a Gatekeeper warning. In Finder, right-click **谷子学术.app**, choose **Open**, and confirm the prompt.
          - The app does not promise reliable automatic replacement. Use the **Releases** page to download and install preview updates manually.
          - Windows packages are not included until real-machine validation is complete.
          EOF
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release create "$RELEASE_TAG" release/* --repo "${GITHUB_REPOSITORY}" --verify-tag --prerelease --notes-file release-notes.md --title "Guzi Scholar $RELEASE_TAG Preview"
